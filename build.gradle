plugins {
    id 'application'
}

version = '0.2.6'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // AlloyX CLI: allx run / test / transpile
    mainClass = 'alloyx.Cli'
    applicationName = 'allx'
}

jar {
    // embed the build version so `allx --version` (read via
    // getImplementationVersion()) reports it at runtime
    manifest {
        attributes 'Implementation-Version': project.version
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
